<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">GenAI Security Gateway risk action gate</title>
  <desc id="desc">Detector scores flow into a weighted risk engine and action gate that blocks, quarantines, or allows a request.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B365D"/></marker><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1B365D" flood-opacity=".16"/></filter></defs>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="55" y="55" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1B365D">Risk scoring | Evidence becomes policy</text>
  <g font-family="Arial, sans-serif" fill="#1B365D" text-anchor="middle" filter="url(#shadow)">
    <rect x="65" y="190" width="210" height="110" rx="15" fill="#FFF4B8" stroke="#1B365D" stroke-width="3"/><text x="170" y="232" font-size="17" font-weight="700"><tspan x="170">Detector scores</tspan><tspan x="170" dy="25" font-size="13" font-weight="400">Regex | semantic | PII</tspan><tspan x="170" dy="20" font-size="13" font-weight="400">Evidence + explanations</tspan></text>
    <rect x="360" y="190" width="220" height="110" rx="15" fill="#FFD59A" stroke="#1B365D" stroke-width="3"/><text x="470" y="232" font-size="17" font-weight="700"><tspan x="470">Weighted risk engine</tspan><tspan x="470" dy="25" font-size="13" font-weight="400">Normalize to 0.0 - 1.0</tspan><tspan x="470" dy="20" font-size="13" font-weight="400">Policy version recorded</tspan></text>
    <polygon points="730,170 820,245 730,320 640,245" fill="#FFD59A" stroke="#1B365D" stroke-width="3"/><text x="730" y="240" font-size="17" font-weight="700"><tspan x="730">Action gate</tspan><tspan x="730" dy="22" font-size="12" font-weight="400">Risk + confidence</tspan></text>
    <rect x="920" y="90" width="210" height="78" rx="14" fill="#FFB4A2" stroke="#1B365D" stroke-width="3"/><text x="1025" y="124" font-size="16" font-weight="700"><tspan x="1025">BLOCK</tspan><tspan x="1025" dy="21" font-size="12" font-weight="400">High risk / signature</tspan></text>
    <rect x="920" y="205" width="210" height="78" rx="14" fill="#FFD59A" stroke="#1B365D" stroke-width="3"/><text x="1025" y="239" font-size="16" font-weight="700"><tspan x="1025">QUARANTINE</tspan><tspan x="1025" dy="21" font-size="12" font-weight="400">Review before release</tspan></text>
    <rect x="920" y="320" width="210" height="78" rx="14" fill="#D9F0FF" stroke="#1B365D" stroke-width="3"/><text x="1025" y="354" font-size="16" font-weight="700"><tspan x="1025">ALLOW</tspan><tspan x="1025" dy="21" font-size="12" font-weight="400">Continue to guarded RAG</tspan></text>
  </g>
  <g stroke="#1B365D" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M275 245 H355"/><path d="M580 245 H635"/><path d="M795 215 L915 130"/><path d="M820 245 H915"/><path d="M795 275 L915 360"/></g>
  <text x="860" y="132" font-family="Arial, sans-serif" font-size="12" fill="#52677F">high confidence or ≥ 0.80</text><text x="850" y="235" font-family="Arial, sans-serif" font-size="12" fill="#52677F">0.50 - 0.79</text><text x="850" y="355" font-family="Arial, sans-serif" font-size="12" fill="#52677F">&lt; 0.50</text>
  <text x="55" y="470" font-family="Arial, sans-serif" font-size="14" fill="#52677F">Navy = control path | yellow = evidence | orange = policy | coral = blocked action | light blue = permitted flow</text>
</svg>

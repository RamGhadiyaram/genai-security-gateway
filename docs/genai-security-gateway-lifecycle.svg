<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">GenAI Security Gateway request lifecycle</title>
  <desc id="desc">Layered flow from user input through API protection, normalization, parallel detection, risk policy, retrieval, document guardrails, model processing, output validation, and safe response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B365D"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1B365D" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1400" height="900" fill="#FFFFFF"/>
  <text x="70" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B365D">GenAI Security Gateway | Request Lifecycle</text>
  <text x="70" y="90" font-family="Arial, sans-serif" font-size="16" fill="#52677F">Every layer treats language and retrieved content as untrusted until policy allows it forward.</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#1B365D" text-anchor="middle" filter="url(#shadow)">
    <rect x="70" y="145" width="190" height="82" rx="14" fill="#D9F0FF" stroke="#1B365D" stroke-width="3"/>
    <text x="165" y="180" font-weight="700"><tspan x="165">1. User input</tspan><tspan x="165" dy="24" font-size="13" font-weight="400">Prompt arrives</tspan></text>
    <rect x="310" y="145" width="190" height="82" rx="14" fill="#D9F0FF" stroke="#1B365D" stroke-width="3"/>
    <text x="405" y="180" font-weight="700"><tspan x="405">2. API layer</tspan><tspan x="405" dy="24" font-size="13" font-weight="400">Auth | rate limit | audit</tspan></text>
    <rect x="550" y="145" width="190" height="82" rx="14" fill="#FFF4B8" stroke="#1B365D" stroke-width="3"/>
    <text x="645" y="180" font-weight="700"><tspan x="645">3. Normalize</tspan><tspan x="645" dy="24" font-size="13" font-weight="400">Whitespace | Base64 | leetspeak</tspan></text>
  </g>
  <g stroke="#1B365D" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M260 186 H305"/><path d="M500 186 H545"/><path d="M740 186 V305"/></g>
  <rect x="440" y="305" width="410" height="210" rx="18" fill="#FFF9D7" stroke="#1B365D" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="645" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1B365D">4. Parallel detection layer</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#1B365D" text-anchor="middle" filter="url(#shadow)">
    <rect x="470" y="370" width="155" height="74" rx="12" fill="#FFF4B8" stroke="#1B365D" stroke-width="2"/><text x="547" y="402" font-weight="700"><tspan x="547">Regex</tspan><tspan x="547" dy="22" font-size="12" font-weight="400">Known signatures</tspan></text>
    <rect x="665" y="370" width="155" height="74" rx="12" fill="#FFF4B8" stroke="#1B365D" stroke-width="2"/><text x="742" y="402" font-weight="700"><tspan x="742">Semantic</tspan><tspan x="742" dy="22" font-size="12" font-weight="400">Intent similarity</tspan></text>
    <rect x="565" y="452" width="155" height="48" rx="12" fill="#FFF4B8" stroke="#1B365D" stroke-width="2"/><text x="642" y="482" font-weight="700">PII scan</text>
  </g>
  <g stroke="#1B365D" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M645 305 V365"/><path d="M547 444 L610 475"/><path d="M742 444 L680 475"/><path d="M645 515 V570"/></g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#1B365D" text-anchor="middle" filter="url(#shadow)">
    <rect x="545" y="570" width="200" height="78" rx="14" fill="#FFD59A" stroke="#1B365D" stroke-width="3"/><text x="645" y="604" font-weight="700"><tspan x="645">5. Risk engine</tspan><tspan x="645" dy="23" font-size="13" font-weight="400">Bounded score 0.0 to 1.0</tspan></text>
  </g>
  <path d="M645 648 V695" stroke="#1B365D" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <polygon points="645,695 730,750 645,805 560,750" fill="#FFD59A" stroke="#1B365D" stroke-width="3"/>
  <text x="645" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1B365D"><tspan x="645">6. Action gate</tspan><tspan x="645" dy="22" font-size="12" font-weight="400">Policy decision</tspan></text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#1B365D" text-anchor="middle" filter="url(#shadow)">
    <rect x="80" y="710" width="220" height="68" rx="13" fill="#FFB4A2" stroke="#1B365D" stroke-width="3"/><text x="190" y="740" font-weight="700"><tspan x="190">BLOCK</tspan><tspan x="190" dy="20" font-size="12" font-weight="400">403 + audit event</tspan></text>
    <rect x="350" y="710" width="220" height="68" rx="13" fill="#FFD59A" stroke="#1B365D" stroke-width="3"/><text x="460" y="740" font-weight="700"><tspan x="460">QUARANTINE</tspan><tspan x="460" dy="20" font-size="12" font-weight="400">Human or policy review</tspan></text>
    <rect x="800" y="710" width="220" height="68" rx="13" fill="#D9F0FF" stroke="#1B365D" stroke-width="3"/><text x="910" y="740" font-weight="700"><tspan x="910">ALLOW</tspan><tspan x="910" dy="20" font-size="12" font-weight="400">Continue to retrieval</tspan></text>
    <rect x="1080" y="710" width="240" height="68" rx="13" fill="#D9F0FF" stroke="#1B365D" stroke-width="3"/><text x="1200" y="740" font-weight="700"><tspan x="1200">7. Safe response</tspan><tspan x="1200" dy="20" font-size="12" font-weight="400">Guarded output to client</tspan></text>
  </g>
  <g stroke="#1B365D" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M560 750 H305"/><path d="M560 765 H575"/><path d="M730 750 H795"/><path d="M1020 744 H1075"/></g>
  <text x="70" y="855" font-family="Arial, sans-serif" font-size="14" fill="#52677F">Colors: light blue = application/data flow | yellow = guardrails and detection | orange = policy decisions | coral = blocked action | navy = trusted control path</text>
</svg>

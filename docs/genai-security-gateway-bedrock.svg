<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">GenAI Security Gateway with Amazon Bedrock</title>
  <desc id="desc">Production flow from client through security gateway and approved retrieval, to Amazon Bedrock under IAM authorization, then output validation and audit.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B365D"/></marker><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1B365D" flood-opacity=".16"/></filter></defs>
  <rect width="1400" height="720" fill="#FFFFFF"/>
  <text x="65" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B365D">Production path | Gateway + Amazon Bedrock</text>
  <text x="65" y="90" font-family="Arial, sans-serif" font-size="16" fill="#52677F">The gateway makes the security decisions. Bedrock performs model reasoning inside AWS controls.</text>
  <g font-family="Arial, sans-serif" fill="#1B365D" text-anchor="middle" filter="url(#shadow)">
    <rect x="65" y="220" width="205" height="100" rx="15" fill="#D9F0FF" stroke="#1B365D" stroke-width="3"/><text x="167" y="260" font-size="17" font-weight="700"><tspan x="167">Client</tspan><tspan x="167" dy="25" font-size="13" font-weight="400">Web or API request</tspan></text>
    <rect x="350" y="170" width="260" height="200" rx="18" fill="#FFF4B8" stroke="#1B365D" stroke-width="3"/><text x="480" y="214" font-size="18" font-weight="700"><tspan x="480">GenAI Security Gateway</tspan><tspan x="480" dy="28" font-size="13" font-weight="400">Normalize | detect | score</tspan><tspan x="480" dy="21" font-size="13" font-weight="400">authorize | audit</tspan></text><rect x="390" y="292" width="180" height="46" rx="10" fill="#FFD59A" stroke="#1B365D" stroke-width="2"/><text x="480" y="321" font-size="13" font-weight="700">Policy gate</text>
    <rect x="720" y="115" width="230" height="105" rx="15" fill="#D9F0FF" stroke="#1B365D" stroke-width="3"/><text x="835" y="155" font-size="17" font-weight="700"><tspan x="835">Approved retrieval</tspan><tspan x="835" dy="24" font-size="13" font-weight="400">Data store + document</tspan><tspan x="835" dy="19" font-size="13" font-weight="400">guardrail</tspan></text>
    <rect x="720" y="300" width="230" height="105" rx="15" fill="#FFD59A" stroke="#1B365D" stroke-width="3"/><text x="835" y="340" font-size="17" font-weight="700"><tspan x="835">Amazon Bedrock</tspan><tspan x="835" dy="24" font-size="13" font-weight="400">Approved model ID</tspan><tspan x="835" dy="19" font-size="13" font-weight="400">Runtime invocation</tspan></text>
    <rect x="1040" y="300" width="210" height="105" rx="15" fill="#FFD59A" stroke="#1B365D" stroke-width="3"/><text x="1145" y="340" font-size="17" font-weight="700"><tspan x="1145">AWS IAM</tspan><tspan x="1145" dy="24" font-size="13" font-weight="400">Least privilege</tspan><tspan x="1145" dy="19" font-size="13" font-weight="400">Workload role</tspan></text>
    <rect x="1040" y="115" width="210" height="105" rx="15" fill="#FFF4B8" stroke="#1B365D" stroke-width="3"/><text x="1145" y="155" font-size="17" font-weight="700"><tspan x="1145">Output guardrail</tspan><tspan x="1145" dy="24" font-size="13" font-weight="400">Validate + sanitize</tspan><tspan x="1145" dy="19" font-size="13" font-weight="400">Before response</tspan></text>
    <rect x="720" y="520" width="530" height="70" rx="14" fill="#FFB4A2" stroke="#1B365D" stroke-width="3"/><text x="985" y="550" font-size="16" font-weight="700"><tspan x="985">Protected audit trail</tspan><tspan x="985" dy="22" font-size="12" font-weight="400">Request ID | policy version | model | latency | action</tspan></text>
  </g>
  <g stroke="#1B365D" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M270 270 H345"/><path d="M610 250 H715"/><path d="M610 330 H715"/><path d="M950 350 H1035"/><path d="M835 300 V225"/><path d="M950 170 H1035"/><path d="M1145 405 V515"/><path d="M835 405 V515"/><path d="M480 370 V515 H715"/></g>
  <path d="M1035 330 H950" stroke="#1B365D" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="990" y="318" font-family="Arial, sans-serif" font-size="12" fill="#52677F" text-anchor="middle">authorized call</text>
  <text x="65" y="665" font-family="Arial, sans-serif" font-size="14" fill="#52677F">Light blue = flow and data | yellow = guardrails | orange = AWS/model policy | coral = audit boundary | navy = control path</text>
</svg>
